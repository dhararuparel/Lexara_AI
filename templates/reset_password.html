<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reset Password — Lexara AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/login.css"/>
</head>
<body>
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;background:#0f172a">
  <div style="width:100%;max-width:400px;background:#111827;border:1px solid #334155;border-radius:16px;padding:2rem;box-shadow:0 8px 32px rgba(0,0,0,.5)">
    <div style="text-align:center;margin-bottom:1.5rem">
      <div style="width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,#7c3aed,#8b5cf6);display:flex;align-items:center;justify-content:center;margin:0 auto .75rem;font-size:1.4rem">🔒</div>
      <h1 style="font-family:'Playfair Display',serif;font-size:1.3rem;color:#f8fafc">Reset Password</h1>
      <p style="color:#64748b;font-size:.82rem;margin-top:.3rem">Enter your new password below</p>
    </div>

    <div id="alertBox" style="display:none;padding:.6rem .85rem;border-radius:8px;font-size:.8rem;margin-bottom:1rem"></div>

    <form id="resetForm" onsubmit="doReset(event)" style="display:flex;flex-direction:column;gap:.9rem">
      <div>
        <label style="font-size:.75rem;font-weight:500;color:#94a3b8;display:block;margin-bottom:.3rem">New Password</label>
        <input type="password" id="newPwd" placeholder="Min. 6 characters" required minlength="6"
          style="width:100%;padding:.6rem .8rem;background:rgba(30,41,59,.8);border:1.5px solid #334155;border-radius:9px;color:#f8fafc;font-size:.86rem;font-family:inherit;outline:none"/>
      </div>
      <div>
        <label style="font-size:.75rem;font-weight:500;color:#94a3b8;display:block;margin-bottom:.3rem">Confirm Password</label>
        <input type="password" id="confirmPwd" placeholder="Repeat password" required
          style="width:100%;padding:.6rem .8rem;background:rgba(30,41,59,.8);border:1.5px solid #334155;border-radius:9px;color:#f8fafc;font-size:.86rem;font-family:inherit;outline:none"/>
      </div>
      <button type="submit" id="submitBtn"
        style="padding:.72rem;background:#8b5cf6;color:#fff;border:none;border-radius:10px;font-size:.9rem;font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s">
        Reset Password
      </button>
    </form>
    <p style="text-align:center;margin-top:1rem;font-size:.78rem;color:#64748b">
      <a href="/login" style="color:#8b5cf6;text-decoration:none">Back to Sign In</a>
    </p>
  </div>
</div>
<script>
const TOKEN = "{{ token }}";
async function doReset(e) {
  e.preventDefault();
  const pwd = document.getElementById('newPwd').value;
  const confirm = document.getElementById('confirmPwd').value;
  const alert = document.getElementById('alertBox');
  const btn = document.getElementById('submitBtn');
  if (pwd !== confirm) { showAlert('Passwords do not match', 'error'); return; }
  btn.textContent = 'Resetting…'; btn.disabled = true;
  const r = await fetch('/api/auth/reset-password', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({token: TOKEN, password: pwd})
  });
  const d = await r.json();
  if (r.ok) {
    showAlert('Password reset! Redirecting…', 'success');
    setTimeout(() => window.location.href = '/login', 1500);
  } else {
    showAlert(d.error || 'Failed', 'error');
    btn.textContent = 'Reset Password'; btn.disabled = false;
  }
}
function showAlert(msg, type) {
  const el = document.getElementById('alertBox');
  el.textContent = msg;
  el.style.display = 'block';
  el.style.background = type === 'error' ? 'rgba(220,38,38,.1)' : 'rgba(34,211,238,.1)';
  el.style.border = type === 'error' ? '1px solid rgba(220,38,38,.3)' : '1px solid rgba(34,211,238,.3)';
  el.style.color = type === 'error' ? '#fca5a5' : '#22d3ee';
}
</script>
</body>
</html>
